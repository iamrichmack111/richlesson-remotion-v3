name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bandit
        uses: PyCQA/bandit-action@v1
        with:
          targets: scripts
          severity: low
          confidence: low
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-runtime.txt pip-audit
      - run: pip-audit
      - run: npm ci
      - run: npm audit --audit-level=high
